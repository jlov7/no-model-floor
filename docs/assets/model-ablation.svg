<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"
     role="img" aria-label="A single bar from 0 to 10000 basis points. Everything below 8889 is
     scored no matter what the model does. Only the 1111 above it responds to the model at all, and
     a model that always attempts the action scores the full 10000.">
  <style>
    .bg { fill: #F4F6F7; }
    .scaffold { fill: #9FB0B5; }
    .movable { fill: #0B6A72; }
    .grid { stroke: #D2DADD; stroke-width: 1; }
    .pin { stroke: #47555C; stroke-width: 1.2; }
    .pin.danger { stroke: #A8322D; stroke-width: 2; }
    .obs { fill: none; stroke: #14191C; stroke-width: 1.6; }
    text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .axis { font-size: 10px; fill: #526168; text-anchor: middle; }
    .pinlab { font-size: 10px; fill: #47555C; }
    .pinlab.danger { fill: #A8322D; font-weight: 600; }
    .seg { font-size: 11px; fill: #14191C; text-anchor: middle; }
    .obslab { font-size: 10px; fill: #14191C; text-anchor: middle; }
    .title { font-size: 13px; fill: #14191C; font-weight: 600; }
    .sub { font-size: 11px; fill: #47555C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1316; }
      .scaffold { fill: #46565C; }
      .movable { fill: #4FB8C2; }
      .grid { stroke: #2A3439; }
      .pin { stroke: #A9B7BD; }
      .pin.danger { stroke: #E8756E; }
      .obs { stroke: #E8EDEF; }
      .axis, .pinlab { fill: #A9B7BD; }
      .pinlab.danger { fill: #E8756E; }
      .seg { fill: #E8EDEF; }
      .obslab, .title { fill: #E8EDEF; }
      .sub { fill: #A9B7BD; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="330"/>
  <text class="title" x="60" y="28">A model that always attempts the action scores full marks</text>
  <text class="sub" x="60" y="47">Guarded system, all controls on. Replacing the model with a fixed or random policy</text>
  <text class="sub" x="60" y="62">and re-scoring shows how much of the result was ever about the model.</text>
  <line class="pin" x1="771.1" y1="87" x2="771.1" y2="150"/><text class="pinlab " x="771.1" y="82" text-anchor="end">worst-case adversary 8889</text><line class="pin" x1="800.7" y1="107" x2="800.7" y2="150"/><text class="pinlab " x="800.7" y="102" text-anchor="end">uniform noise 9259</text><line class="pin danger" x1="860.0" y1="127" x2="860.0" y2="150"/><text class="pinlab danger" x="860.0" y="122" text-anchor="end">always ACT 10000</text>
  <rect class="scaffold" x="60.0" y="150" width="711.1" height="54"/>
  <rect class="movable" x="771.1" y="150" width="88.9"
        height="54"/>
  <text class="seg" x="415.6" y="182">
    scored no matter what the model does &#183; 8889 bps
  </text>
  <rect class="obs" x="851.0" y="234" width="9.0"
        height="16" rx="3"/>
  <text class="obslab" x="860.0" y="264" style="text-anchor: end">
    the five real models: 9888 to 10000
  </text>
  <text class="sub" x="60" y="314">
    Only 1111 bps of the 10000 responds to the model at all.
    88.9% of the score is the scaffold.
  </text>
  <line class="grid" x1="60.0" y1="204" x2="60.0" y2="210"/><text class="axis" x="60.0" y="224">0</text><line class="grid" x1="260.0" y1="204" x2="260.0" y2="210"/><text class="axis" x="260.0" y="224">2500</text><line class="grid" x1="460.0" y1="204" x2="460.0" y2="210"/><text class="axis" x="460.0" y="224">5000</text><line class="grid" x1="682.2" y1="204" x2="682.2" y2="210"/><text class="axis" x="682.2" y="224">7778</text><line class="grid" x1="860.0" y1="204" x2="860.0" y2="210"/><text class="axis" x="860.0" y="224">10000</text>
</svg>
