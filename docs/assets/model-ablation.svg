<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450"
     role="img" aria-label="A single bar from 0 to 10000 basis points. Everything below 8889 is
     scored no matter what the model does. Only the 1111 above it responds to the model at all, and
     a model that always attempts the action scores the full 10000.">
  <style>
    .bg { fill: #F4F6F7; }
    .scaffold { fill: #9FB0B5; }
    .movable { fill: #0B6A72; }
    .grid { stroke: #D2DADD; stroke-width: 1; }
    .pin { stroke: #47555C; stroke-width: 1.2; }
    .pin.danger { stroke: #A8322D; stroke-width: 2; }
    text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .axis { font-size: 20px; fill: #526168; text-anchor: middle; }
    .pinlab { font-size: 20px; fill: #47555C; }
    .pinlab.danger { fill: #A8322D; font-weight: 600; }
    .seg { font-size: 20px; fill: #14191C; text-anchor: middle; }
    .obslab { font-size: 20px; fill: #14191C; }
    .title { font-size: 24px; fill: #14191C; font-weight: 600; }
    .sub { font-size: 20px; fill: #47555C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1316; }
      .scaffold { fill: #46565C; }
      .movable { fill: #4FB8C2; }
      .grid { stroke: #2A3439; }
      .pin { stroke: #A9B7BD; }
      .pin.danger { stroke: #E8756E; }
      .axis, .pinlab { fill: #A9B7BD; }
      .pinlab.danger { fill: #E8756E; }
      .seg { fill: #E8EDEF; }
      .obslab, .title { fill: #E8EDEF; }
      .sub { fill: #A9B7BD; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="480" height="450"/>
  <text class="title" x="40" y="34">Scaffold floor: 8889/10000</text>
  <line class="pin" x1="386.7" y1="93" x2="386.7" y2="215"/><text class="pinlab " x="386.7" y="88" text-anchor="end">worst-case 8889</text><line class="pin" x1="401.1" y1="133" x2="401.1" y2="215"/><text class="pinlab " x="401.1" y="128" text-anchor="end">uniform noise 9259</text><line class="pin danger" x1="430.0" y1="173" x2="430.0" y2="215"/><text class="pinlab danger" x="430.0" y="168" text-anchor="end">always ACT 10000</text>
  <rect class="scaffold" x="40.0" y="215" width="346.7" height="60"/>
  <rect class="movable" x="386.7" y="215" width="43.3"
        height="60"/>
  <text class="seg" x="213.3" y="240">
    model-independent score
  </text>
  <text class="seg" x="213.3" y="264">8889 bps</text>
  <text class="obslab" x="40" y="374">
    observed models: 9888 to 10000
  </text>
  <text class="sub" x="40" y="406">Model-sensitive: 1111 bps</text>
  <text class="sub" x="40" y="432">Scaffold share: 88.9%</text>
  <line class="grid" x1="40.0" y1="275" x2="40.0" y2="282"/><text class="axis" x="40.0" y="303">0</text><line class="grid" x1="137.5" y1="275" x2="137.5" y2="282"/><text class="axis" x="137.5" y="303">2500</text><line class="grid" x1="235.0" y1="275" x2="235.0" y2="282"/><text class="axis" x="235.0" y="303">5000</text><line class="grid" x1="343.3" y1="275" x2="343.3" y2="282"/><text class="axis" x="343.3" y="303">7778</text><line class="grid" x1="430.0" y1="275" x2="430.0" y2="282"/><text class="axis" x="430.0" y="303">10000</text>
</svg>
