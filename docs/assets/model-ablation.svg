<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450"
     role="img" aria-label="A single bar from 0 to 10000 basis points. Everything below 8889 is
     scored no matter what the model does. Only the 1111 above it responds to the model at all, and
     a model that always attempts the action scores the full 10000.">
  <style>
    .bg { fill: #F4F6F7; }
    .scaffold { fill: #9FB0B5; }
    .movable { fill: #0B6A72; }
    .grid { stroke: #D2DADD; stroke-width: 1; }
    .pin { stroke: #47555C; stroke-width: 1.2; }
    .pin.danger { stroke: #A8322D; stroke-width: 2; }
    .obs { fill: none; stroke: #14191C; stroke-width: 1.6; }
    text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .axis { font-size: 11px; fill: #526168; text-anchor: middle; }
    .pinlab { font-size: 12px; fill: #47555C; }
    .pinlab.danger { fill: #A8322D; font-weight: 600; }
    .seg { font-size: 12px; fill: #14191C; text-anchor: middle; }
    .obslab { font-size: 12px; fill: #14191C; }
    .title { font-size: 15px; fill: #14191C; font-weight: 600; }
    .sub { font-size: 12px; fill: #47555C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1316; }
      .scaffold { fill: #46565C; }
      .movable { fill: #4FB8C2; }
      .grid { stroke: #2A3439; }
      .pin { stroke: #A9B7BD; }
      .pin.danger { stroke: #E8756E; }
      .obs { stroke: #E8EDEF; }
      .axis, .pinlab { fill: #A9B7BD; }
      .pinlab.danger { fill: #E8756E; }
      .seg { fill: #E8EDEF; }
      .obslab, .title { fill: #E8EDEF; }
      .sub { fill: #A9B7BD; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="480" height="450"/>
  <text class="title" x="32" y="28">A model that always attempts the action</text>
  <text class="title" x="32" y="47">scores full marks</text>
  <text class="sub" x="32" y="71">Guarded system, all controls on. Replacing the model</text>
  <text class="sub" x="32" y="87">with a fixed or random policy and re-scoring shows how</text>
  <text class="sub" x="32" y="103">much of the result was ever about the model.</text>
  <line class="pin" x1="401.8" y1="121" x2="401.8" y2="230"/><text class="pinlab " x="401.8" y="116" text-anchor="end">worst-case adversary 8889</text><line class="pin" x1="417.2" y1="153" x2="417.2" y2="230"/><text class="pinlab " x="417.2" y="148" text-anchor="end">uniform noise 9259</text><line class="pin danger" x1="448.0" y1="185" x2="448.0" y2="230"/><text class="pinlab danger" x="448.0" y="180" text-anchor="end">always ACT 10000</text>
  <rect class="scaffold" x="32.0" y="230" width="369.8" height="52"/>
  <rect class="movable" x="401.8" y="230" width="46.2"
        height="52"/>
  <text class="seg" x="216.9" y="254">
    scored no matter what the model does
  </text>
  <text class="seg" x="216.9" y="271">8889 bps</text>
  <rect class="obs" x="443.3" y="324" width="4.7"
        height="16" rx="3"/>
  <text class="obslab" x="32" y="365">
    the five real models: 9888 to 10000
  </text>
  <text class="sub" x="32" y="415">Only 1111 bps of the 10000 responds to the model at all.</text>
  <text class="sub" x="32" y="433">88.9% of the score is the scaffold.</text>
  <line class="grid" x1="32.0" y1="282" x2="32.0" y2="288"/><text class="axis" x="32.0" y="302">0</text><line class="grid" x1="136.0" y1="282" x2="136.0" y2="288"/><text class="axis" x="136.0" y="302">2500</text><line class="grid" x1="240.0" y1="282" x2="240.0" y2="288"/><text class="axis" x="240.0" y="302">5000</text><line class="grid" x1="355.6" y1="282" x2="355.6" y2="288"/><text class="axis" x="355.6" y="302">7778</text><line class="grid" x1="448.0" y1="282" x2="448.0" y2="288"/><text class="axis" x="448.0" y="302">10000</text>
</svg>
