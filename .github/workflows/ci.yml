name: checks

permissions:
  contents: read

# Runs scripts/ci.sh and nothing else. `make ci` runs the same file, so a green run here and a
# green run on a laptop mean the same thing and cannot drift apart.
#
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Track the latest security/bug-fix patch in the supported 3.13 line.
          python-version: '3.13'
      # ci.sh treats lint as advisory when ruff is absent, so a contributor without it can still
      # run every other check. On the runner that gates pushes it must not be advisory: without
      # this line the lint step printed "ruff not installed, skipping" on every run and no lint
      # error could ever fail a build.
      - run: python -m pip install ruff==0.13.1
      - run: ./scripts/ci.sh
